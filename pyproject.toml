[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stat-narrator"
version = "0.1.0"
description = "Translates statistical model outputs into plain-language research narratives"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["ux-research", "statistics", "nlg", "cpr", "product-research"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.20"]
gemini = ["google-genai>=1.0"]
llm = ["openai>=1.0", "anthropic>=0.20", "google-genai>=1.0"]

[project.scripts]
stat-narrator = "statnarrator.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["statnarrator*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
